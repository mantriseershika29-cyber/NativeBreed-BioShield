services:
  - type: web
    name: nativebreed-bioshield
    runtime: python
    buildCommand: npm ci && npm run build && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: REVIEWER_KEY
        generateValue: true
